# steel-etl site configuration for the v2 MkDocs website
# Usage: steel-etl site --config v2/site.yaml

# SCC registry (for per-book printing provenance stamps)
registry: ../steel-etl/classification.json

# Source: steel-etl md-linked output (per-book Read trees in the consolidated repo)
source_dirs:
  - ../data/data-unified/en/books/heroes/md-linked
  - ../data/data-unified/en/books/beastheart/md-linked
  - ../data/data-unified/en/books/summoner/md-linked
  - ../data/data-unified/en/books/monsters/md-linked

# MkDocs docs directory
docs_dir: ./docs

# Books for per-book Read grouping. `key` matches the SCC prefix (substring
# before the first '/'); `folder` is the URL slug; `label` is the display title;
# `order` sets book ordering in the Read tab. `icon` is the iconPaths key for the
# book's card crest (see iconPaths in steel-etl internal/site/cards.go);
# `description` is the blurb shown on the book card in the Books-tab landing.
# Gotchas: `icon` must be a key that EXISTS in iconPaths or the crest silently
# falls back to the scroll glyph (there is no dragon glyph in the MDI free set —
# the Monsters book uses skull). A `label` or `description` containing a colon
# (e.g. "Draw Steel: Monsters") must be quoted, or YAML parses it as a mapping
# and the config load fails.
books:
  - key: mcdm.heroes.v1
    folder: heroes
    label: "Draw Steel: Heroes"
    order: 1
    icon: sword-cross
    description: "The core rulebook — everything you need to build and play a hero: ancestries, classes, kits, careers, and the rules of play."
  - key: mcdm.beastheart.v1
    folder: beastheart
    label: The Beastheart
    order: 2
    icon: paw
    description: The beastheart class and its companion — bond with a monstrous ally and fight as one.
  - key: mcdm.summoner.v1
    folder: summoner
    label: The Summoner
    order: 3
    icon: scroll
    description: The summoner class — call forth minions, signature creatures, and dominion fixtures to fight at your side.
  - key: mcdm.monsters.v1
    folder: bestiary
    label: "Draw Steel: Monsters"
    order: 4
    icon: skull
    description: Monsters and adversaries to challenge your heroes, with statblocks and encounter-building guidance.

# Site sections (mapped to MkDocs tabs)
sections:
  # Browse: modular pages by type (classes, abilities, conditions, etc.)
  - name: Browse
    include:
      - class/
      - feature/
      - condition/
      - complication/
      - movement/
      - negotiation/
      - skill/
      - kit/
      - ancestry/
      - culture/
      - career/
      - perk/
      - title/
      - treasure/
      - skill/
      - rule/
      - religion/
      - project/
      # Beastheart companion stat blocks (monster/companion/beastheart/*) arrive
      # through this include — each has its own scc code + permalink stub;
      # referenced from the beastheart class.
      - monster/
      - dynamic-terrain/
      - retainer/
      # Summoner portfolio minions/champions, fixtures, and the rival summoner
      # all live under monster.* now (folded in via StatblockParser), so they
      # arrive through the monster/ include above — no separate top-level trees.
    exclude:
      - feature/trait/ancestry-traits
    sort: natural
    groups:
      - match_type: kit
        from: feature/ability
        label: Kits
        # Each kit has exactly one ability, so collapse
        # feature/ability/{kit}/{ability}.md → feature/ability/Kits/{kit}-{ability}.md
        # and rewrite the page name to "Kit (Ability)" for the heading + nav.
        flatten: true

  # Read: chapters grouped by book, ordered by source-document position
  - name: Read
    title: Books
    include:
      - chapter/
    group_by_book: true

  # Bestiary: repurposed from a flat browser into a Search & Filter utility
  # (Plan B). The monster / dynamic-terrain / retainer browse trees (and the
  # summoner minion/fixture/champion/rival trees) moved to the Browse section
  # above on 2026-06-10. Until the search widget ships, the tab is a static
  # "coming soon" placeholder owned by static_content
  # (static_content/docs/Bestiary/index.md) — no generated includes here. The
  # `books:` entry for mcdm.monsters.v1 (folder: bestiary) still drives the Read
  # tab's book grouping and is unrelated to this section.

# Search coverage (SC-329). Read is indexed EXCEPT the headings whose section a
# Browse page already carries (steel-etl marks those data-search-exclude), so
# book text is findable exactly once: text with no Browse page (movement
# basics, Director guidance, worked examples…) comes up from Read, everything
# else from its Browse page. Not quite every word: a covered container page's
# own intro prose (e.g. a Monsters group landing's per-echelon introduction)
# is excluded from Read but not reproduced on its Browse page either — findable
# nowhere; deferred to Backlog SC-345. `search_exclude` (whole sections) is
# still supported but unused here.
search_uncovered_only:
  - Read

# Sections whose container pages embed inline item cards (abilities, features,
# traits, statblocks, featureblocks) in place of their inlined markdown. Read
# chapters reference items whose card-able leaves live under Browse, so both
# sections are walked together (the map spans both; links rebase across the
# section boundary). See docs/superpowers/specs/2026-06-16-inline-item-cards-design.md.
embed_card_sections:
  - Browse
  - Read

# Static content overrides (copied last, takes precedence)
static_content: ./static_content/docs
