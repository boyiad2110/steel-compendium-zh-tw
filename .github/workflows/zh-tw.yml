name: zh-TW checks and deployment
on:
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: '中文版正式 URL（含結尾 /），例如 https://example.github.io/steel-compendium-zh-tw/'
        required: true
        type: string
      deploy:
        description: Deploy verified build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: zh-tw-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SC_SITE_URL: ${{ inputs.site_url || 'http://127.0.0.1:8000/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify entire PR diff (unknown means full)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/check.py classify
      - name: Test CI routing and document validation
        run: python3 -m unittest discover -s tests -p test_ci.py
      - name: Check governance documents
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/check.py docs
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.mode != 'docs'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          node-version: '24'
      - run: pip install -r requirements.lock.txt
        if: steps.scope.outputs.mode != 'docs'
      - run: python scripts/l10n/verify.py
        if: steps.scope.outputs.mode != 'docs'
      - name: Upload CI classification and document reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: reports/ci-*.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.mode != 'docs'
        with:
          name: localization-reports
          path: reports/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
